<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#166534">

  <title>KASIR SB</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      color: #14532d;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      padding: 28px 20px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 18px #00000012;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      margin: 8px 0;
    }

    p {
      color: #4b5563;
      line-height: 1.6;
    }

    .button {
      display: block;
      margin-top: 24px;
      padding: 15px;
      border-radius: 10px;
      background: #166534;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .note {
      margin-top: 22px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <img
      class="logo"
      src="https://lh3.googleusercontent.com/d/1w0Vwuk4aov4_XaylCpUH9tTJaVzCyAdM"
      alt="Logo SB Digital Studio"
    >

    <h1>KASIR SB</h1>

    <p>
      Aplikasi kasir digital untuk toko dan warung Anda.
    </p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbxCZGEQcWM9_pJcdwnfHtIiV0GMFBp1wyU69ua4_xw1Mjj1CQ1hcFp68vc6JGcUHOeA/exec"
      target="_blank"
      rel="noopener"
    >
      Buka Aplikasi Kasir
    </a>

    <p class="note">
      Powered by SB Digital Studio
    </p>
  </main>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./service-worker.js")
        .catch(function (error) {
          console.error("Service Worker gagal:", error);
        });
    });
  }
</script>
</body>
</html>
